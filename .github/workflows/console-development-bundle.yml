name: Isolated console development bundle
on:
  push:
    branches: [feat/console-functional-actions-20260921]
    paths: [.github/workflows/console-development-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Package tracked public code and locked development runtime only
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/console-bundle/repo" "$RUNNER_TEMP/console-bundle/runtime"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/console-bundle/repo"
          cd "$RUNNER_TEMP/console-bundle/repo"
          npm ci --prefix services/oauth --ignore-scripts
          npm ci --prefix adapters/chatgpt-web --ignore-scripts
          cp "$(command -v node)" "$RUNNER_TEMP/console-bundle/runtime/node"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$RUNNER_TEMP/console-bundle/COMMIT"
          tar -czf "$RUNNER_TEMP/console-source-runtime.tar.gz" -C "$RUNNER_TEMP/console-bundle" repo runtime COMMIT
          sha256sum "$RUNNER_TEMP/console-source-runtime.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-isolated-source-runtime
          path: ${{ runner.temp }}/console-source-runtime.tar.gz
          retention-days: 1
          if-no-files-found: error
