name: UI review source bundle
on:
  push:
    branches: [ui/anchored-select-layout-20260928]
    paths: [.github/workflows/ui-review-bundle.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/ui-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-review-public-source
          path: ${{ runner.temp }}/ui-source.tar.gz
          retention-days: 1
          if-no-files-found: error
