name: Search review source bundle
on:
  push:
    branches: [fix/search-hybrid-relevance-20261010]
    paths: [.github/workflows/search-review-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package public tracked history only, without Git configuration or runtime data
        run: |
          set -eu
          git bundle create "$RUNNER_TEMP/search-source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/search-source.bundle"
          sha256sum "$RUNNER_TEMP/search-source.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search-review-public-source
          path: ${{ runner.temp }}/search-source.bundle
          retention-days: 1
          if-no-files-found: error
