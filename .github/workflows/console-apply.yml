name: Apply verified console implementation
on:
  push:
    branches: [feat/console-functional-actions-20260921]
    paths: [.github/workflows/console-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Conner512/Mnemuron' && github.ref == 'refs/heads/feat/console-functional-actions-20260921'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Decode and verify the prepared public source diff
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          files = sorted(pathlib.Path('.github').glob('console-change-??.b64'))
          assert len(files) == 10, 'incomplete source transport'
          raw = lzma.decompress(base64.b64decode(''.join(f.read_text() for f in files), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '5b38d067c178835f94f638ce87d62a1a16124ce990433a9e7b61808f5fe11f7d', 'source digest mismatch'
          assert b'diff --git a/.github/' not in raw, 'workflow edits are not part of the source diff'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'console-implementation.patch').write_bytes(raw)
          PY
          git apply --check --unidiff-zero "$RUNNER_TEMP/console-implementation.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/console-implementation.patch"
          git diff --cached --check
      - name: Install locked isolated test dependencies
        run: |
          npm ci --prefix services/oauth --ignore-scripts
          npm ci --prefix adapters/chatgpt-web --ignore-scripts
      - name: Existing and new isolated regression suites
        run: node scripts/test-all.mjs
      - name: Check public source content
        run: node scripts/check-publication.mjs --worktree
      - name: Commit tested source without changing main or deploying
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          BRANCH=feat/console-functional-actions-20260921
          ACTUAL=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$ACTUAL" = "$EXPECTED_HEAD"
          git config user.name Conner512
          git config user.email 51692123+Conner512@users.noreply.github.com
          git commit -m "feat(console): connect account-scoped actions to backend services"
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD
