name: Apply tested cloud connection implementation
on:
  push:
    branches: [feat/cloud-memory-connections-20260928]
    paths: [.github/cloud-connection-transfer/**, .github/workflows/cloud-connection-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify and apply the prepared public source diff
        run: |
          set -eu
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          const dir='.github/cloud-connection-transfer';
          const names=['01','02','03','04','05','06','07','08','09a','09b','09c','09d','10','11','12a','12b','12c','12d','13','14'].map(n=>n+'.txt');
          const text=names.map(n=>fs.readFileSync(path.join(dir,n),'utf8').trim()).join('');
          if(!/^[A-Za-z0-9+/]+={0,2}$/.test(text))throw new Error('Invalid source transport');
          const compressed=Buffer.from(text,'base64');
          const hash=data=>createHash('sha256').update(data).digest('hex');
          if(hash(compressed)!=='ea68a7e1660b917477c2f07a680eddffb4533f77d847910724018e1a73eaf263')throw new Error('Compressed source hash mismatch');
          const diff=gunzipSync(compressed,{maxOutputLength:1048576});
          if(hash(diff)!=='f196e1c7240bfe851a1463b543a69e456406f9e0fa4b54ed930ac3ffeb7158cf')throw new Error('Source diff hash mismatch');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'cloud-connections.patch'),diff,{mode:0o600});
          console.log('Verified public-source diff: '+diff.length+' bytes');
          NODE
          git apply --check --index --unidiff-zero "$RUNNER_TEMP/cloud-connections.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/cloud-connections.patch"
          git rm -rf .github/cloud-connection-transfer .github/workflows/cloud-connection-apply.yml
          git diff --cached --check
          git diff --cached --stat
      - name: Install existing locked application dependencies
        run: |
          npm ci --prefix services/oauth --ignore-scripts
          npm ci --prefix adapters/chatgpt-web --ignore-scripts
      - name: Existing and new isolated regression suites
        run: node scripts/test-all.mjs
      - name: Public source checks
        run: |
          node scripts/check-publication.mjs --worktree
          node scripts/check-publication.mjs --staged
      - name: Commit verified implementation to the feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          BRANCH=feat/cloud-memory-connections-20260928
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          REMOTE=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$REMOTE" = "$GITHUB_SHA"
          git config user.name Conner512
          git config user.email 51692123+Conner512@users.noreply.github.com
          git commit -m 'feat: cloud memory read/write and managed connection onboarding'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$BRANCH"
          git log -1 --format='%H %s'
