name: Console browser integration
on:
  pull_request:
    paths:
      - 'web/console/**'
      - 'services/oauth/**'
      - 'server/lib/**'
      - 'shared/**'
      - 'scripts/test-console-browser.py'
      - 'scripts/test-console-*.mjs'
      - 'scripts/console_select_checks.py'
      - '.github/workflows/console-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Locked application dependencies
        run: |
          npm ci --prefix services/oauth --ignore-scripts
          npm ci --prefix adapters/chatgpt-web --ignore-scripts
      - name: Chinese glyphs for disposable browser screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          fc-match -f '%{family}\n' ':lang=zh-cn'
      - name: Disposable browser test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/console-browser-env"
          "$RUNNER_TEMP/console-browser-env/bin/pip" install --disable-pip-version-check playwright==1.57.0
          command -v google-chrome
          google-chrome --version
      - name: Real HTTP console workflows with synthetic identities only
        run: '"$RUNNER_TEMP/console-browser-env/bin/python" scripts/test-console-browser.py'
      - name: Locked browser runtime for connection, completion and model acceptance
        run: npm install --prefix "$RUNNER_TEMP/console-browser-node" --ignore-scripts --no-audit --no-fund playwright@1.57.0
      - name: Connection, completion and model workflows with synthetic identities only
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/console-browser-node/node_modules/playwright/index.mjs"
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          export MNEMURON_UI_EVIDENCE="$RUNNER_TEMP"
          node scripts/test-console-connections.mjs
          node scripts/test-console-completion.mjs
          node scripts/test-console-models.mjs
          node scripts/test-console-organize.mjs
          node scripts/test-console-refinements.mjs
          node scripts/test-console-audit.mjs
          node scripts/test-console-entities.mjs
          node scripts/test-console-responsive.mjs
      - name: Synthetic non-secret preview screenshots
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-functional-synthetic-previews
          path: |
            ${{ runner.temp }}/mnemuron-browser-test-*/previews/*.png
            ${{ runner.temp }}/connections-browser-*/*.png
            ${{ runner.temp }}/completion-browser-*/*.png
            ${{ runner.temp }}/model-browser-*/*.png
            ${{ runner.temp }}/organize-browser-*/*.png
            ${{ runner.temp }}/refinements-browser-*/*.png
            ${{ runner.temp }}/mnemuron-audit-browser-*/*.png
            ${{ runner.temp }}/entities-browser-*/*.png
            ${{ runner.temp }}/responsive-browser-*/*.png
          retention-days: 3
          if-no-files-found: error
