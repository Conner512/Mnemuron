name: Bug report
description: Report a reproducible problem with synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese reports are welcome. Do not include real conversations, memory exports, credentials, private addresses, or database files. Do not disclose security vulnerabilities in a public report.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server / API
        - ChatGPT / Codex plugin
        - OpenClaw adapter
        - Hermes adapter
        - Documentation
        - Other / unsure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Repository commit or component version, runtime version, and relevant host version. Do not include personal installation paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps and synthetic input needed to reproduce the problem. Mention whether the test uses a fresh database and session.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a sanitized error code or small output excerpt if useful, not a raw log dump.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe sharing
      options:
        - label: I have removed credentials, personal memory, real conversation content, and private infrastructure details.
          required: true
